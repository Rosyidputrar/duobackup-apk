version: 2
updates:
  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
